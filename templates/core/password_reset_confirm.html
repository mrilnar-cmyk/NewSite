<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — Formula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body style="background: var(--bg-light);">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="auth-form-container" style="max-width: 520px;">
            {% if validlink %}
                <div class="text-center mb-4">
                    <div class="mb-3" style="font-size: 3rem; color: var(--primary);">
                        <i class="bi bi-key"></i>
                    </div>
                    <h2 class="auth-form-title">Установка нового пароля</h2>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.new_password1 }}
                    </div>
                    <div class="mb-4">
                        {{ form.new_password2 }}
                    </div>
                    <button type="submit" class="btn btn-auth btn-auth-primary w-100">
                        Сохранить пароль
                    </button>
                </form>
            {% else %}
                <div class="text-center">
                    <div class="mb-3" style="font-size: 3rem; color: var(--danger);">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h2 class="fw-bold mb-3">Ссылка недействительна</h2>
                    <p class="text-secondary mb-4">
                        Попробуйте запросить восстановление пароля ещё раз.
                    </p>
                    <a href="{% url 'core:password_reset' %}" class="btn btn-primary">
                        Запросить снова
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
