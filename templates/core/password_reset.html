<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — FormulaCalc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-left">
            <div class="auth-branding">
                <div class="auth-logo">
                    <i class="bi bi-calculator"></i>
                </div>
                <h1 class="auth-brand-title">FormulaCalc</h1>
                <p class="auth-brand-subtitle">Система расчёта формул</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-container">
                <div class="text-center mb-4">
                    <div class="mb-3" style="font-size: 3rem; color: var(--primary);">
                        <i class="bi bi-envelope-paper"></i>
                    </div>
                    <h2 class="auth-form-title">Восстановление пароля</h2>
                    <p class="auth-form-subtitle">
                        Введите email, указанный при регистрации.
                        Мы отправим ссылку для сброса пароля.
                    </p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        {{ form.email }}
                    </div>

                    <button type="submit" class="btn btn-auth btn-auth-primary mb-3">
                        Отправить ссылку
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'core:login' %}" class="text-secondary text-decoration-none">
                        <small><i class="bi bi-arrow-left me-1"></i>Вернуться к входу</small>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
