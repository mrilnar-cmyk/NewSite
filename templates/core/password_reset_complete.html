<!-- templates/core/password_reset_complete.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменён — Formula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body style="background: var(--bg-light);">
    <div class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="text-center p-5">
            <div class="mb-4" style="font-size: 5rem; color: var(--success);">
                <i class="bi bi-check-circle"></i>
            </div>
            <h2 class="fw-bold mb-3">Пароль успешно изменён</h2>
            <p class="text-secondary mb-4" style="max-width: 420px;">
                Теперь вы можете войти с новым паролем.
            </p>
            <a href="{% url 'core:login' %}" class="btn btn-primary">
                Войти
            </a>
        </div>
    </div>
</body>
</html>
