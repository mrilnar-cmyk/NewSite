{% extends 'base.html' %}

{% block title %}Новый проект{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-folder-plus"></i> Новый проект</h4>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        {{ form.description }}
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a href="{% url 'calculator:project_list' %}" class="btn btn-outline-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
